<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教育智能客服 · 演示台</title>
<style>
  /* ============ 设计令牌：清爽白 × 靛蓝 ============ */
  :root {
    --bg: #F7F8FC;            /* 页面浅灰白 */
    --panel: #FFFFFF;          /* 卡片白 */
    --line: #E7EAF0;           /* 分隔线 */
    --ink: #111827;            /* 主文字 */
    --ink-2: #4B5563;          /* 次文字 */
    --ink-3: #9AA1AE;          /* 弱文字 */
    --brand: #4F46E5;          /* 靛蓝主色 */
    --brand-deep: #4338CA;
    --brand-tint: #EEF0FE;     /* 主色淡底 */
    --ok: #10B981;             /* 成功绿 */
    --ok-tint: #E7F7F0;
    --warn: #D97706;           /* 待处理琥珀 */
    --warn-tint: #FDF3E3;
    --bad: #E11D48;            /* 取消红 */
    --bad-tint: #FDECEF;
    --info: #2563EB;           /* 信息蓝 */
    --info-tint: #EAF1FE;
    --shadow: 0 1px 2px rgba(17, 24, 39, .05), 0 1px 3px rgba(17, 24, 39, .04);
    --r-lg: 14px;              /* 大卡 */
    --r-md: 10px;              /* 行卡 */
    --r-sm: 8px;               /* 控件 */
    --font: "PingFang SC", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: var(--font); color: var(--ink); background: var(--bg);
    display: flex; flex-direction: column; font-size: 14px; }
  button { font-family: inherit; cursor: pointer; border: 1px solid transparent; }
  button:focus-visible, textarea:focus-visible, select:focus-visible {
    outline: 2px solid var(--brand); outline-offset: 2px;
  }

  /* ============ 顶栏 ============ */
  header {
    background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 12px 24px; display: flex; align-items: center; gap: 16px;
  }
  .logo { width: 34px; height: 34px; border-radius: 10px; background: var(--brand);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 700; }
  header h1 { font-size: 16px; font-weight: 600; letter-spacing: .5px; }
  header .sub { font-size: 12px; color: var(--ink-3); margin-left: 2px; }
  header .spacer { flex: 1; }
  .conn { font-size: 12px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
  .conn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
  .conn.ok .dot { background: var(--ok); }
  .conn.ok { color: var(--ink-2); }
  .switcher { display: flex; align-items: center; gap: 10px; }
  .switcher label { font-size: 12px; color: var(--ink-2); display: flex;
    align-items: center; gap: 6px; cursor: pointer; }
  .switcher input[type=checkbox] { accent-color: var(--brand); }
  select {
    appearance: none; -webkit-appearance: none;
    background: var(--panel) url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%236B7280' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E") no-repeat right 12px center;
    border: 1px solid var(--line); border-radius: var(--r-sm);
    padding: 8px 32px 8px 12px; font-size: 13px; color: var(--ink); font-family: inherit;
    cursor: pointer;
  }
  .btn { border-radius: var(--r-sm); font-size: 13px; padding: 8px 14px; transition: background .15s, border-color .15s; }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-primary:hover { background: var(--brand-deep); }
  .btn-primary:disabled { background: #C7CBF5; cursor: not-allowed; }
  .btn-ghost { background: var(--panel); color: var(--ink-2); border-color: var(--line); }
  .btn-ghost:hover { border-color: var(--brand); color: var(--brand); }

  main { flex: 1; display: flex; overflow: hidden; }

  /* ============ 对话区 ============ */
  .chat-wrap { flex: 1.5; display: flex; flex-direction: column; min-width: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 24px 28px 12px; }
  .msg { max-width: 72%; margin-bottom: 14px; line-height: 1.7; }
  .msg .who { font-size: 11px; color: var(--ink-3); margin: 0 4px 5px; }
  .msg .bubble { padding: 11px 15px; white-space: pre-wrap; word-break: break-word; }
  .msg.bot .bubble {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 3px 14px 14px 14px; box-shadow: var(--shadow); color: var(--ink);
  }
  .msg.user { margin-left: auto; }
  .msg.user .who { text-align: right; }
  .msg.user .bubble {
    background: var(--brand); color: #fff;
    border-radius: 14px 3px 14px 14px;
  }
  /* 系统/任务提示：居中细条 */
  .msg.system { max-width: 86%; margin-left: auto; margin-right: auto; }
  .msg.system .bubble {
    background: var(--brand-tint); color: var(--brand-deep);
    border-radius: var(--r-sm); font-size: 12.5px; padding: 7px 12px; text-align: center;
  }
  .msg.warn .bubble { background: var(--warn-tint); color: var(--warn); }
  .msg .meta { font-size: 11px; color: var(--ink-3); margin: 5px 4px 0; }
  .msg .meta .track { color: var(--brand); font-weight: 600; }
  .typing { padding: 2px 30px 14px; font-size: 12.5px; color: var(--ink-3); }
  .typing i { font-style: normal; animation: blink 1.1s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .typing i { animation: none; } }

  /* 输入区 */
  .composer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 20px 14px; }
  .composer .row { display: flex; gap: 10px; }
  .composer textarea {
    flex: 1; resize: none; height: 46px; padding: 11px 14px; font-size: 14px;
    font-family: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: var(--r-md); outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .composer textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-tint); background: #fff; }
  .composer .btn-primary { height: 46px; min-width: 76px; }
  .quick { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
  .quick button {
    font-size: 12px; padding: 5px 12px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line); color: var(--ink-2);
  }
  .quick button:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-tint); }

  /* ============ 右栏：学籍卡 ============ */
  aside {
    width: 350px; flex-shrink: 0; border-left: 1px solid var(--line);
    background: var(--bg); overflow-y: auto; padding: 16px;
  }
  .sec { margin-bottom: 18px; }
  .sec > h2 {
    font-size: 13px; font-weight: 600; color: var(--ink);
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
  }
  .sec > h2 .hint { font-size: 11px; font-weight: 400; color: var(--ink-3); }
  .sec > h2::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
  .sec-empty { color: var(--ink-3); font-size: 12px; padding: 8px 2px; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; margin-bottom: 8px; box-shadow: var(--shadow); }

  /* 档案 */
  .profile .name { font-size: 15px; font-weight: 600; }
  .profile .tags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .profile .tags span { font-size: 12px; color: var(--brand-deep); background: var(--brand-tint);
    padding: 2px 9px; border-radius: 999px; }

  /* 状态胶囊 */
  .pill { display: inline-flex; align-items: center; font-size: 11px; font-weight: 600;
    padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .pill.g { color: var(--ok); background: var(--ok-tint); }
  .pill.b { color: var(--info); background: var(--info-tint); }
  .pill.y { color: var(--warn); background: var(--warn-tint); }
  .pill.r { color: var(--bad); background: var(--bad-tint); }

  /* 订单 */
  .order .head { display: flex; align-items: center; gap: 8px; }
  .order .no { font-family: var(--mono); font-size: 12px; color: var(--ink-2); flex: 1; }
  .order .amt { font-size: 13px; font-weight: 600; }
  .order .items { margin-top: 7px; border-top: 1px dashed var(--line); padding-top: 7px; }
  .order .items .item { font-size: 12px; color: var(--ink-2); padding: 3px 0;
    display: flex; justify-content: space-between; gap: 8px; }
  .order .items .item em { font-style: normal; color: var(--ink); flex: 1; }
  .order .acts { margin-top: 8px; display: flex; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 5px;
    font-size: 11.5px; padding: 4px 11px; border-radius: 8px;
    background: var(--panel); border: 1px solid var(--line); color: var(--ink-2);
    transition: background .15s, color .15s, border-color .15s; }
  .chip svg { width: 12px; height: 12px; flex-shrink: 0; }
  .chip:hover { color: var(--brand); border-color: var(--brand); background: var(--brand-tint); }
  .chip.amber { color: var(--warn); border-color: #F2C98A; background: #FFFCF5; }
  .chip.amber:hover { color: #fff; background: var(--warn); border-color: var(--warn); }
  .cohort .acts { margin-top: 8px; display: flex; gap: 6px; }
  .cohort .acts .chip:hover { color: var(--brand); border-color: var(--brand); background: var(--brand-tint); }

  /* 班次 */
  .cohort .head { display: flex; align-items: center; gap: 8px; }
  .cohort .name { font-size: 13px; font-weight: 600; flex: 1; }
  .cohort .series { font-size: 11px; color: var(--ink-3); margin-top: 3px; }
  .cohort .prog { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 9px; }
  .cohort .prog .cell { background: var(--bg); border-radius: var(--r-sm); padding: 7px 2px; text-align: center; }
  .cohort .prog .cell b { display: block; font-size: 13px; color: var(--brand-deep); font-family: var(--mono); }
  .cohort .prog .cell span { font-size: 10px; color: var(--ink-3); }

  /* 会话档案 */
  .archive-box pre {
    white-space: pre-wrap; word-break: break-all; color: var(--ink-2);
    font-family: var(--mono); font-size: 11px; max-height: 280px; overflow-y: auto;
  }
  .archive-box .cap { font-size: 12px; color: var(--ink); margin-bottom: 6px; font-weight: 600; }
  .ops { display: flex; flex-wrap: wrap; gap: 6px; }
  .ops .btn { font-size: 12px; padding: 6px 12px; }

  @media (max-width: 940px) {
    main { flex-direction: column; }
    aside { width: 100%; border-left: none; border-top: 1px solid var(--line); }
    .msg { max-width: 88%; }
  }
</style>
</head>
<body>
<header>
  <div class="logo">教</div>
  <div>
    <h1>教育智能客服</h1>
    <div class="sub">演示台 · 真实业务数据 · 全程轨迹留痕</div>
  </div>
  <div class="spacer"></div>
  <div class="conn" id="connWrap"><span class="dot"></span><span id="connState">未连接</span></div>
  <div class="switcher">
    <label><input type="checkbox" id="sseMode" checked> 流式</label>
    <select id="userSel" aria-label="演示用户">
      <option value="1001">学员 1001</option>
      <option value="1002">学员 1002</option>
      <option value="1003">学员 1003</option>
    </select>
    <button id="newSessionBtn" class="btn btn-primary">新会话</button>
  </div>
</header>

<main>
  <div class="chat-wrap">
    <div id="messages"></div>
    <div id="typing" class="typing" hidden>小度正在思考<i>…</i></div>
    <div class="composer">
      <div class="row">
        <textarea id="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
        <button id="sendBtn" class="btn btn-primary">发送</button>
      </div>
      <div class="quick" id="quick"></div>
    </div>
  </div>

  <aside>
    <div class="sec">
      <h2>学籍档案 <span class="hint" id="profileHint"></span></h2>
      <div id="profileBox" class="sec-empty">正在调取…</div>
    </div>
    <div class="sec">
      <h2>我的订单 <span class="hint">购买明细</span></h2>
      <div id="ordersBox" class="sec-empty">正在调取…</div>
    </div>
    <div class="sec">
      <h2>在读班次 <span class="hint">考勤 / 视频 / 作业 / 考试</span></h2>
      <div id="cohortsBox" class="sec-empty">正在调取…</div>
    </div>
    <div class="sec">
      <h2>退款记录</h2>
      <div id="refundsBox" class="sec-empty">暂无退款申请</div>
    </div>
    <div class="sec">
      <h2>会话操作</h2>
      <div class="ops">
        <button class="btn btn-ghost" onclick="loadHistory()">历史回溯</button>
        <button class="btn btn-ghost" onclick="loadState()">当前状态</button>
        <button class="btn btn-ghost" onclick="loadTraces()">处理轨迹</button>
      </div>
    </div>
    <div class="sec">
      <h2>会话档案</h2>
      <div id="archiveBox" class="card archive-box">
        <div class="sec-empty">发送消息后，任务状态与处理轨迹会显示在这里。</div>
      </div>
    </div>
  </aside>
</main>
<script src="/static/app.js"></script>
</body>
</html>
