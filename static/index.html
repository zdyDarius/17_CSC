<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教育智能客服 · 演示台</title>
<style>
  :root {
    --bg: #f5f6fa;
    --panel: #ffffff;
    --brand: #2b6cb0;
    --brand-dark: #1e4e8c;
    --text: #1f2933;
    --muted: #6b7280;
    --border: #e5e7eb;
    --user: #2b6cb0;
    --bot: #ffffff;
    --warn: #c05621;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column;
  }
  header {
    background: var(--brand); color: #fff; padding: 10px 20px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 17px; font-weight: 600; }
  header .conn { font-size: 12px; opacity: .85; }
  main { flex: 1; display: flex; overflow: hidden; }
  .chat-wrap { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 18px 22px; }
  .msg { max-width: 76%; margin-bottom: 12px; line-height: 1.65; }
  .msg .bubble { padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; font-size: 14px; }
  .msg.user { margin-left: auto; }
  .msg.user .bubble { background: var(--user); color: #fff; border-bottom-right-radius: 2px; }
  .msg.bot .bubble { background: var(--bot); border: 1px solid var(--border); border-bottom-left-radius: 2px; }
  .msg .meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .msg.bot.degraded .bubble { border-color: var(--warn); }
  .composer { border-top: 1px solid var(--border); background: var(--panel); padding: 10px 14px; }
  .composer .row { display: flex; gap: 8px; }
  .composer textarea {
    flex: 1; resize: none; height: 46px; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 14px; font-family: inherit; outline: none;
  }
  .composer textarea:focus { border-color: var(--brand); }
  button {
    border: none; border-radius: 8px; cursor: pointer; font-size: 13px;
    background: var(--brand); color: #fff; padding: 8px 14px;
  }
  button:hover { background: var(--brand-dark); }
  button:disabled { background: #cbd5e0; cursor: not-allowed; }
  button.ghost { background: #eef2f7; color: var(--text); }
  button.ghost:hover { background: #e2e8f0; }
  aside {
    width: 320px; border-left: 1px solid var(--border); background: var(--panel);
    overflow-y: auto; padding: 14px;
  }
  aside h2 { font-size: 13px; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
  .card { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; font-size: 13px; }
  .card .row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
  input[type=text], select {
    flex: 1; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; outline: none;
  }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; }
  .quick button { font-size: 12px; padding: 5px 10px; }
  #stateBox { font-size: 12px; }
  #stateBox pre { background: #f8fafc; border: 1px solid var(--border); border-radius: 6px; padding: 8px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
  .tag { display: inline-block; background: #eef2f7; border-radius: 4px; padding: 1px 6px; font-size: 11px; color: var(--muted); margin-left: 6px; }
  .hint { color: var(--muted); font-size: 12px; margin: 4px 0 8px; }
</style>
</head>
<body>
<header>
  <h1>教育智能客服 · 演示台</h1>
  <div class="conn"><span id="connState">未连接</span> · <label><input type="checkbox" id="sseMode" checked> 流式(SSE)</label></div>
</header>
<main>
  <div class="chat-wrap">
    <div id="messages"></div>
    <div class="composer">
      <div class="row">
        <textarea id="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
        <button id="sendBtn">发送</button>
      </div>
    </div>
  </div>
  <aside>
    <h2>演示用户</h2>
    <div class="card">
      <div class="row">
        <select id="userSel">
          <option value="1001">学员A（user 1001）</option>
          <option value="1002">学员B（user 1002）</option>
          <option value="1003">学员C（user 1003）</option>
        </select>
        <button id="newSessionBtn">新会话</button>
      </div>
      <div class="hint">X-User-Id 请求头；会话绑定用户后不可跨用户访问。</div>
    </div>
    <h2>场景速发</h2>
    <div class="card">
      <div class="quick" id="quick"></div>
    </div>
    <h2>会话操作</h2>
    <div class="card">
      <div class="quick">
        <button class="ghost" onclick="loadHistory()">历史回溯</button>
        <button class="ghost" onclick="loadState()">当前状态</button>
        <button class="ghost" onclick="loadTraces()">处理轨迹</button>
      </div>
    </div>
    <h2>状态面板</h2>
    <div id="stateBox"><div class="hint">创建会话后显示任务/槽位状态。</div></div>
  </aside>
</main>
<script src="/static/app.js"></script>
</body>
</html>
