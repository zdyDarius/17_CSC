[project]
name = "edu-customer-service"
version = "0.1.0"
description = "教育行业智能客服系统（课程咨询、订单查询、学习进度、退款申请、工单提交）"
requires-python = ">=3.12"
dependencies = [
    "aiomysql>=0.2.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "jieba>=0.42.1",
    "jinja2>=3.1.4",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "pydantic-settings>=2.4.0",
    "pymysql>=1.1.1",
    "pyyaml>=6.0.1",
    "sqlalchemy[asyncio]>=2.0.30",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
